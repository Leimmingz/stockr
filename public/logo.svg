<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="shelfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Montant gauche -->
  <rect x="30" y="30" width="6" height="140" rx="3" fill="url(#shelfGrad)"/>
  <!-- Montant droit -->
  <rect x="112" y="30" width="6" height="140" rx="3" fill="url(#shelfGrad)"/>

  <!-- Planches -->
  <rect x="28" y="30" width="92" height="7" rx="3.5" fill="url(#shelfGrad)"/>
  <rect x="28" y="95" width="92" height="7" rx="3.5" fill="url(#shelfGrad)"/>
  <rect x="28" y="160" width="92" height="7" rx="3.5" fill="url(#shelfGrad)"/>

  <!-- Boites étagère haute -->
  <rect x="38" y="44" width="22" height="44" rx="4" fill="url(#boxGrad1)" opacity="0.9"/>
  <rect x="65" y="52" width="18" height="36" rx="4" fill="url(#boxGrad2)" opacity="0.85"/>
  <rect x="88" y="47" width="20" height="41" rx="4" fill="url(#boxGrad1)" opacity="0.75"/>

  <!-- Boites étagère basse -->
  <rect x="38" y="110" width="26" height="43" rx="4" fill="url(#boxGrad2)" opacity="0.9"/>
  <rect x="70" y="118" width="16" height="35" rx="4" fill="url(#boxGrad1)" opacity="0.8"/>
  <rect x="90" y="113" width="20" height="40" rx="4" fill="url(#boxGrad2)" opacity="0.7"/>

  <!-- Point scan -->
  <circle cx="51" cy="66" r="4" fill="white" opacity="0.5"/>

  <!-- Texte -->
  <text x="148" y="118" font-size="62" font-weight="800" letter-spacing="-2" fill="#1E1B4B">Stock</text>
  <text x="311" y="118" font-size="62" font-weight="800" letter-spacing="-2" fill="url(#shelfGrad)">r</text>
  <text x="149" y="143" font-size="13" font-weight="400" fill="#6B7280" letter-spacing="3.5">GESTION DE DÉPÔT</text>
</svg>
